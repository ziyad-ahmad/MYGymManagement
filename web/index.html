<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKHADA GYM | Home</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            font-family: 'Poppins', sans-serif;
            height: 100%;
            width: 100%;
        }

        /* Hero section */
        .hero {
            position: relative;
            background: url('https://images.pexels.com/photos/841130/pexels-photo-841130.jpeg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 20px;
        }

        /* Dark overlay for readability */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            font-style: italic;
            color: #f0f0f0;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        /* Buttons */
        .btn-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 250px;
            margin: auto;
        }

        .btn-custom {
            display: block;
            padding: 14px 25px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff4c29, #ff6b4a);
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255,76,41,0.4);
        }

        .btn-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,76,41,0.6);
        }

        .btn-admin {
            background: linear-gradient(135deg, #0077b6, #0096c7);
            box-shadow: 0 5px 15px rgba(0,118,182,0.4);
        }

        .btn-admin:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,118,182,0.6);
        }

        /* Responsive for mobile */
        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to Akhada 🏋️</h1>
            <p>"Push yourself because no one else is going to do it for you."</p>

            <div class="btn-box">
                <a href="Register.jsp" class="btn-custom">Register</a>
                <a href="Login.jsp" class="btn-custom">Login</a>
                <a href="AdminLogin.jsp" class="btn-custom btn-admin">Admin Login</a>
            </div>
        </div>
    </section>
</body>
</html>
